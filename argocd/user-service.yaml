apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: user-service
  namespace: argocd

spec:
  project: gitops-project

  source:
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/gitops-project.git
    targetRevision: main
    path: kubernetes/overlays/dev/user-service

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true