apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sammyCHY/Mini_Project-Advanced_GitOps_Techniques.git
    targetRevision: main
    path: kubernetes/backend/overlays/prod

  destination:
    name: cluster-prod
    namespace: backend-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true